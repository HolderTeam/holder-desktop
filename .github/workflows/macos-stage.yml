name: macOS staged app

on:
  workflow_dispatch:
    inputs:
      desktop_run_id:
        description: GitHub Actions run ID that uploaded holder-desktop-macos
        required: true
        type: string
      backend_run_id:
        description: GitHub Actions run ID that uploaded holder-daemon-macos-backend
        required: true
        type: string
      launcher_run_id:
        description: GitHub Actions run ID that uploaded holder-launcher-macos
        required: true
        type: string
      desktop_repository:
        description: Repository containing the desktop artifact
        required: true
        type: string
        default: HolderTeam/holder-desktop
      backend_repository:
        description: Repository containing the backend artifact
        required: true
        type: string
        default: HolderTeam/holder-daemon
      launcher_repository:
        description: Repository containing the launcher artifact
        required: true
        type: string
        default: HolderTeam/holder-launcher

permissions:
  actions: read
  contents: read

jobs:
  stage:
    runs-on: macos-15

    steps:
      - name: Check out holder-desktop
        uses: actions/checkout@v4

      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: holder-desktop-macos
          path: downloads/desktop
          github-token: ${{ github.token }}
          repository: ${{ inputs.desktop_repository }}
          run-id: ${{ inputs.desktop_run_id }}

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: holder-daemon-macos-backend
          path: downloads/backend
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ inputs.backend_repository }}
          run-id: ${{ inputs.backend_run_id }}

      - name: Download launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: holder-launcher-macos
          path: downloads/launcher
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ inputs.launcher_repository }}
          run-id: ${{ inputs.launcher_run_id }}

      - name: Install Homebrew runtime tools
        run: |
          set -euo pipefail

          brew update
          brew install \
            dylibbundler \
            gtk4 \
            libadwaita \
            gtksourceview5 \
            libspelling \
            libgee \
            libsoup \
            json-glib \
            boost \
            nlohmann-json \
            yaml-cpp \
            spdlog \
            sqlite \
            libsodium \
            libgit2 \
            md4c \
            openssl@3

      - name: Assemble Holder.app
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          homebrew_prefix="$(brew --prefix)"
          homebrew_gdk_pixbuf_prefix="$(brew --prefix gdk-pixbuf)"
          homebrew_gtksourceview_prefix="$(brew --prefix gtksourceview5)"
          homebrew_openssl_prefix="$(brew --prefix openssl@3)"
          app_dir="out/artifacts/Holder.app"
          contents_dir="${app_dir}/Contents"
          resources_dir="${contents_dir}/Resources"

          rm -rf "${app_dir}"
          mkdir -p \
            "${contents_dir}/MacOS" \
            "${resources_dir}/bin" \
            "${resources_dir}/lib" \
            "${resources_dir}/share"

          sed "s/@HOLDER_VERSION@/${version}/g" \
            packaging/macos/Info.plist.in \
            > "${contents_dir}/Info.plist"

          cp downloads/launcher/Holder "${contents_dir}/MacOS/Holder"
          cp downloads/desktop/bin/holder-desktop "${resources_dir}/bin/holder-desktop"
          cp downloads/backend/bin/holderd "${resources_dir}/bin/holderd"
          cp downloads/backend/bin/holderctl "${resources_dir}/bin/holderctl"
          chmod +x \
            "${contents_dir}/MacOS/Holder" \
            "${resources_dir}/bin/holder-desktop" \
            "${resources_dir}/bin/holderd" \
            "${resources_dir}/bin/holderctl"

          cp -a downloads/desktop/share/. "${resources_dir}/share/"
          cp -a downloads/backend/schema "${resources_dir}/schema"
          cp -a downloads/backend/config "${resources_dir}/config"
          cp -a downloads/backend/assets "${resources_dir}/assets"
          cp downloads/backend/openapi.yaml "${resources_dir}/openapi.yaml"

          copy_tree_if_exists() {
            local source_dir="$1"
            local target_dir="$2"
            if [ -d "${source_dir}" ]; then
              mkdir -p "${target_dir}"
              cp -a "${source_dir}/." "${target_dir}/"
            fi
          }

          copy_tree_if_exists "${homebrew_prefix}/share/glib-2.0" "${resources_dir}/share/glib-2.0"
          cp downloads/desktop/share/glib-2.0/schemas/team.holder.Holder.gschema.xml \
            "${resources_dir}/share/glib-2.0/schemas/"
          copy_tree_if_exists "${homebrew_prefix}/share/icons" "${resources_dir}/share/icons"
          copy_tree_if_exists "${homebrew_prefix}/share/themes" "${resources_dir}/share/themes"
          copy_tree_if_exists "${homebrew_prefix}/share/gtk-4.0" "${resources_dir}/share/gtk-4.0"
          copy_tree_if_exists "${homebrew_prefix}/share/libadwaita" "${resources_dir}/share/libadwaita"
          copy_tree_if_exists "${homebrew_gtksourceview_prefix}/share/gtksourceview-5" "${resources_dir}/share/gtksourceview-5"
          copy_tree_if_exists "${homebrew_prefix}/share/gtksourceview-5" "${resources_dir}/share/gtksourceview-5"
          copy_tree_if_exists "${homebrew_prefix}/share/enchant-2" "${resources_dir}/share/enchant-2"
          copy_tree_if_exists "${homebrew_prefix}/share/locale" "${resources_dir}/share/locale"

          find "${resources_dir}" -type f \( -name '*.a' -o -name '*.la' -o -name '*.h' \) -delete

          glib-compile-schemas "${resources_dir}/share/glib-2.0/schemas"

          bundle_binary() {
            local binary="$1"
            local prefix="$2"
            local overwrite_mode="$3"
            local search_args=(-s "${homebrew_prefix}/lib")

            if [ -d "${homebrew_openssl_prefix}/lib" ] &&
              [ "${homebrew_openssl_prefix}/lib" != "${homebrew_prefix}/lib" ]; then
              search_args+=(-s "${homebrew_openssl_prefix}/lib")
            fi

            dylibbundler \
              "${overwrite_mode}" \
              -b \
              -x "${binary}" \
              -d "${resources_dir}/lib" \
              -p "${prefix}" \
              "${search_args[@]}"
          }

          bundle_binary "${contents_dir}/MacOS/Holder" "@executable_path/../Resources/lib" "-od"
          bundle_binary "${resources_dir}/bin/holder-desktop" "@executable_path/../lib" "-of"
          bundle_binary "${resources_dir}/bin/holderd" "@executable_path/../lib" "-of"
          bundle_binary "${resources_dir}/bin/holderctl" "@executable_path/../lib" "-of"

          find "${resources_dir}" -type f -name '*.dylib' -exec chmod u+w {} \;

          copy_tree_if_exists "${homebrew_prefix}/lib/gio" "${resources_dir}/lib/gio"
          copy_tree_if_exists "${homebrew_gdk_pixbuf_prefix}/lib/gdk-pixbuf-2.0" "${resources_dir}/lib/gdk-pixbuf-2.0"
          copy_tree_if_exists "${homebrew_prefix}/lib/gdk-pixbuf-2.0" "${resources_dir}/lib/gdk-pixbuf-2.0"
          copy_tree_if_exists "${homebrew_prefix}/lib/gtk-4.0" "${resources_dir}/lib/gtk-4.0"

          find "${resources_dir}" -type f \( -name '*.a' -o -name '*.la' -o -name '*.h' \) -delete

          (
            cd "${resources_dir}"

            if [ -d "lib/gio/modules" ]; then
              gio-querymodules "lib/gio/modules"
            fi

            if [ -d "lib/gdk-pixbuf-2.0/2.10.0/loaders" ]; then
              GDK_PIXBUF_MODULEDIR="lib/gdk-pixbuf-2.0/2.10.0/loaders" \
                gdk-pixbuf-query-loaders lib/gdk-pixbuf-2.0/2.10.0/loaders/*.so \
                > "lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
            else
              echo "Missing gdk-pixbuf loaders directory: ${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders"
              find "lib/gdk-pixbuf-2.0" -maxdepth 5 -type d 2>/dev/null | sort || true
              exit 1
            fi
          )

          (
            cd "out/artifacts"
            find Holder.app -type f \
              | sort \
              > Holder.app/Contents/Resources/manifest.txt
          )

          find "${app_dir}" -maxdepth 5 -type f | sort

      - name: Smoke-test Holder.app
        run: |
          set -euo pipefail

          app_dir="out/artifacts/Holder.app"
          resources_dir="${app_dir}/Contents/Resources"
          homebrew_prefix="$(brew --prefix)"

          check_file() {
            local path="$1"
            if [ ! -f "${path}" ]; then
              echo "Missing file: ${path}"
              exit 1
            fi
          }

          check_executable() {
            local path="$1"
            if [ ! -x "${path}" ]; then
              echo "Missing executable: ${path}"
              exit 1
            fi
          }

          check_no_match() {
            local pattern="$1"
            local path="$2"
            if grep -Fn -- "${pattern}" "${path}"; then
              echo "Unexpected path leak in ${path}: ${pattern}"
              exit 1
            fi
          }

          check_file "${app_dir}/Contents/Info.plist"
          check_executable "${app_dir}/Contents/MacOS/Holder"
          check_executable "${resources_dir}/bin/holder-desktop"
          check_executable "${resources_dir}/bin/holderd"
          check_executable "${resources_dir}/bin/holderctl"
          check_file "${resources_dir}/schema/schema.sql"
          check_file "${resources_dir}/openapi.yaml"
          check_file "${resources_dir}/share/glib-2.0/schemas/gschemas.compiled"
          check_file "${resources_dir}/share/gtksourceview-5/language-specs/language2.rng"
          check_file "${resources_dir}/manifest.txt"

          check_file "${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          if [ -f "${resources_dir}/lib/gio/modules/giomodule.cache" ]; then
            check_no_match "${app_dir}" "${resources_dir}/lib/gio/modules/giomodule.cache"
            check_no_match "${homebrew_prefix}" "${resources_dir}/lib/gio/modules/giomodule.cache"
          fi
          check_no_match "${app_dir}" "${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          check_no_match "${homebrew_prefix}" "${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          check_no_match "out/artifacts/Holder.app" "${resources_dir}/manifest.txt"

          for binary in \
            "${app_dir}/Contents/MacOS/Holder" \
            "${resources_dir}/bin/holder-desktop" \
            "${resources_dir}/bin/holderd" \
            "${resources_dir}/bin/holderctl"; do
            if otool -L "${binary}" | grep -F "${homebrew_prefix}/"; then
              echo "${binary} still links to Homebrew paths"
              exit 1
            fi
          done

          echo "Running staged holderd --version"
          "${resources_dir}/bin/holderd" --version
          echo "Running staged holderctl --help"
          "${resources_dir}/bin/holderctl" --help

      - name: Upload staged app
        uses: actions/upload-artifact@v4
        with:
          name: Holder-macos-staged
          path: out/artifacts/Holder.app
          if-no-files-found: error
          retention-days: 7
