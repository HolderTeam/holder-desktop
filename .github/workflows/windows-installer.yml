name: Windows installer

on:
  workflow_dispatch:
    inputs:
      staged_run_id:
        description: GitHub Actions run ID that uploaded Holder-windows-staged
        required: true
        type: string
      staged_repository:
        description: Repository containing the staged artifact
        required: true
        type: string
        default: HolderTeam/holder-desktop

permissions:
  actions: read
  contents: read

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - name: Check out holder-desktop
        uses: actions/checkout@v4

      - name: Download staged package
        uses: actions/download-artifact@v4
        with:
          name: Holder-windows-staged
          path: downloads/Holder-windows-staged
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ inputs.staged_repository }}
          run-id: ${{ inputs.staged_run_id }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content VERSION -Raw).Trim()
          $stageDir = (Resolve-Path "downloads\Holder-windows-staged").Path
          $outputDir = (New-Item -ItemType Directory -Force "out\artifacts\windows-installer").FullName
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          & $iscc `
            "/DStageDir=$stageDir" `
            "/DAppVersion=$version" `
            "/O$outputDir" `
            "packaging\windows\Holder.iss"

          $setupExe = Join-Path $outputDir "Holder-$version-Setup.exe"
          if (!(Test-Path $setupExe)) {
            throw "Installer was not created: $setupExe"
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SETUP_EXE=$setupExe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = (New-Item -ItemType Directory -Force "out\installer-smoke\Holder").FullName
          $logPath = Join-Path (Resolve-Path "out\installer-smoke").Path "install.log"

          $process = Start-Process `
            -FilePath $env:SETUP_EXE `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$installDir",
              "/LOG=$logPath"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            Get-Content $logPath -ErrorAction SilentlyContinue
            throw "Installer exited with code $($process.ExitCode)"
          }

          $requiredFiles = @(
            "bin\holder-desktop.exe",
            "bin\holderd.exe",
            "bin\holderctl.exe",
            "share\glib-2.0\schemas\gschemas.compiled",
            "schema\schema.sql",
            "openapi.yaml"
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $installDir $file
            if (!(Test-Path $path)) {
              throw "Installed file missing: $file"
            }
          }

          & (Join-Path $installDir "bin\holderd.exe") --version
          & (Join-Path $installDir "bin\holderctl.exe") --help

          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $binDir = Join-Path $installDir "bin"
          if ($userPath -notlike "*$binDir*") {
            throw "Installer did not add Holder bin directory to user PATH"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process `
              -FilePath $uninstaller `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
              -Wait
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Holder-windows-installer
          path: out/artifacts/windows-installer/*.exe
          if-no-files-found: error
          retention-days: 7
