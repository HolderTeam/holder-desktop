name: Windows desktop

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out holder-desktop
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-libspelling
            mingw-w64-ucrt-x86_64-libgee
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-json-glib

      - name: Build and test
        run: bash ./make-win.sh test

      - name: Stage desktop artifact
        run: |
          set -euo pipefail

          build_dir="build-win"
          stage_dir="out/artifacts/windows-desktop"

          copy_tree_if_exists() {
            local source_dir="$1"
            local relative_dir="${source_dir#/ucrt64/}"
            local target_dir="${stage_dir}/${relative_dir}"

            if [ -d "${source_dir}" ]; then
              mkdir -p "$(dirname "${target_dir}")"
              cp -a "${source_dir}" "${target_dir}"
            fi
          }

          copy_msys2_dll_deps() {
            local changed=1

            while [ "${changed}" -eq 1 ]; do
              changed=0

              while IFS= read -r binary; do
                while IFS= read -r dll; do
                  case "${dll}" in
                    /ucrt64/bin/*.dll)
                      local target="${stage_dir}/bin/$(basename "${dll}")"
                      if [ ! -f "${target}" ]; then
                        cp -f "${dll}" "${target}"
                        changed=1
                      fi
                      ;;
                  esac
                done < <(
                  ldd "${binary}" \
                    | awk '/=>/ { print $3 } /^[[:space:]]*\/ucrt64\// { print $1 }' \
                    | sort -u
                )
              done < <(find "${stage_dir}" -type f \( -name '*.exe' -o -name '*.dll' \))
            done
          }

          rm -rf "${stage_dir}"
          mkdir -p \
            "${stage_dir}/bin" \
            "${stage_dir}/share/applications" \
            "${stage_dir}/share/glib-2.0/schemas" \
            "${stage_dir}/share/holder-desktop" \
            "${stage_dir}/share/metainfo"

          cp "${build_dir}/holder-desktop.exe" "${stage_dir}/bin/"
          cp data/team.holder.Holder.desktop "${stage_dir}/share/applications/"
          cp data/team.holder.Holder.metainfo.xml "${stage_dir}/share/metainfo/"
          cp img/holder.jpg "${stage_dir}/share/holder-desktop/"

          cp /ucrt64/share/glib-2.0/schemas/*.xml "${stage_dir}/share/glib-2.0/schemas/"
          cp data/team.holder.Holder.gschema.xml "${stage_dir}/share/glib-2.0/schemas/"

          copy_tree_if_exists /ucrt64/lib/gdk-pixbuf-2.0
          copy_tree_if_exists /ucrt64/lib/gio
          copy_tree_if_exists /ucrt64/lib/gtk-4.0
          copy_tree_if_exists /ucrt64/share/icons
          copy_tree_if_exists /ucrt64/share/themes
          copy_tree_if_exists /ucrt64/share/gtk-4.0
          copy_tree_if_exists /ucrt64/share/libadwaita
          copy_tree_if_exists /ucrt64/share/gtksourceview-5
          copy_tree_if_exists /ucrt64/share/locale

          find "${stage_dir}" -type f -name '*.dll.a' -delete

          glib-compile-schemas "${stage_dir}/share/glib-2.0/schemas"

          if [ -d "${stage_dir}/lib/gio/modules" ]; then
            gio-querymodules "${stage_dir}/lib/gio/modules"
          fi

          if [ -d "${stage_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders" ]; then
            (
              cd "${stage_dir}"
              GDK_PIXBUF_MODULEDIR="lib/gdk-pixbuf-2.0/2.10.0/loaders" \
                gdk-pixbuf-query-loaders lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll \
                > lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
            )

            stage_dir_win="$(cygpath -m "$(pwd)/${stage_dir}")"
            awk -v prefix="${stage_dir_win}/" '
              {
                while ((pos = index($0, prefix)) > 0) {
                  $0 = substr($0, 1, pos - 1) substr($0, pos + length(prefix))
                }
                print
              }
            ' "${stage_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" \
              > "${stage_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache.tmp"
            mv \
              "${stage_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache.tmp" \
              "${stage_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          fi

          copy_msys2_dll_deps

          (
            cd "${stage_dir}"
            find . -type f \
              | sed 's#^\./##' \
              | sort \
              > manifest.txt
          )
          du -sh "${stage_dir}"

          find "${stage_dir}" -maxdepth 4 -type f | sort

      - name: Smoke-test staged desktop artifact
        run: |
          set -euo pipefail

          test -f out/artifacts/windows-desktop/bin/holder-desktop.exe
          test -f out/artifacts/windows-desktop/share/glib-2.0/schemas/gschemas.compiled
          test -f out/artifacts/windows-desktop/share/glib-2.0/schemas/team.holder.Holder.gschema.xml
          test -d out/artifacts/windows-desktop/lib/gio/modules
          test -f out/artifacts/windows-desktop/lib/gio/modules/giomodule.cache
          test -d out/artifacts/windows-desktop/lib/gdk-pixbuf-2.0
          test -f out/artifacts/windows-desktop/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
          test -d out/artifacts/windows-desktop/share/icons
          test -f out/artifacts/windows-desktop/share/gtksourceview-5/language-specs/markdown.lang
          test -f out/artifacts/windows-desktop/manifest.txt
          ! grep -F "$(cygpath -m "$(pwd)/out/artifacts/windows-desktop")" \
            out/artifacts/windows-desktop/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
          ! grep -F "out/artifacts/windows-desktop" \
            out/artifacts/windows-desktop/manifest.txt

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: holder-desktop-windows
          path: out/artifacts/windows-desktop/**
          if-no-files-found: error
          retention-days: 7
