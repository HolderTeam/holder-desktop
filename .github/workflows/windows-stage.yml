name: Windows staged package

on:
  workflow_dispatch:
    inputs:
      desktop_run_id:
        description: GitHub Actions run ID that uploaded holder-desktop-windows
        required: true
        type: string
      backend_run_id:
        description: GitHub Actions run ID that uploaded holder-daemon-windows-backend
        required: true
        type: string
      desktop_repository:
        description: Repository containing the desktop artifact
        required: true
        type: string
        default: HolderTeam/holder-desktop
      backend_repository:
        description: Repository containing the backend artifact
        required: true
        type: string
        default: HolderTeam/holder-daemon

permissions:
  actions: read
  contents: read

jobs:
  stage:
    runs-on: windows-latest

    steps:
      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: holder-desktop-windows
          path: downloads/desktop
          github-token: ${{ github.token }}
          repository: ${{ inputs.desktop_repository }}
          run-id: ${{ inputs.desktop_run_id }}

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: holder-daemon-windows-backend
          path: downloads/backend
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ inputs.backend_repository }}
          run-id: ${{ inputs.backend_run_id }}

      - name: Assemble staged package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $desktopDir = "downloads\desktop"
          $backendDir = "downloads\backend"
          $stageDir = "out\artifacts\Holder-windows-staged"

          if (Test-Path $stageDir) {
            Remove-Item $stageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force $stageDir | Out-Null
          Copy-Item "$desktopDir\*" -Destination $stageDir -Recurse -Force

          $binDir = Join-Path $stageDir "bin"
          New-Item -ItemType Directory -Force $binDir | Out-Null

          Copy-Item "$backendDir\holderd.exe", "$backendDir\holderctl.exe" -Destination $binDir -Force
          Get-ChildItem $backendDir -Filter "*.dll" | Copy-Item -Destination $binDir -Force

          foreach ($runtimeDir in @("schema", "config", "assets")) {
            $source = Join-Path $backendDir $runtimeDir
            if (Test-Path $source) {
              Copy-Item $source -Destination $stageDir -Recurse -Force
            }
          }

          $openapi = Join-Path $backendDir "openapi.yaml"
          if (Test-Path $openapi) {
            Copy-Item $openapi -Destination $stageDir -Force
          }

          $root = (Resolve-Path $stageDir).Path
          Get-ChildItem $stageDir -Recurse -File |
            ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace("\", "/") } |
            Sort-Object |
            Set-Content -Encoding UTF8 (Join-Path $stageDir "manifest.txt")

          Get-ChildItem $stageDir -Recurse -File |
            Select-Object FullName, Length |
            Sort-Object FullName

      - name: Smoke-test staged package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stageDir = "out\artifacts\Holder-windows-staged"
          $requiredFiles = @(
            "bin\holder-desktop.exe",
            "bin\holderd.exe",
            "bin\holderctl.exe",
            "share\glib-2.0\schemas\gschemas.compiled",
            "share\glib-2.0\schemas\team.holder.Holder.gschema.xml",
            "share\gtksourceview-5\language-specs\markdown.lang",
            "lib\gio\modules\giomodule.cache",
            "lib\gdk-pixbuf-2.0\2.10.0\loaders.cache",
            "schema\schema.sql",
            "openapi.yaml",
            "manifest.txt"
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $stageDir $file
            if (!(Test-Path $path)) {
              throw "Missing staged file: $file"
            }
          }

          $loaderCache = Join-Path $stageDir "lib\gdk-pixbuf-2.0\2.10.0\loaders.cache"
          if (Select-String -Path $loaderCache -Pattern "D:/a/|out/artifacts/windows-desktop|/ucrt64" -Quiet) {
            throw "GDK Pixbuf loader cache contains a build-machine path"
          }

          $manifest = Join-Path $stageDir "manifest.txt"
          if (Select-String -Path $manifest -Pattern "out/artifacts/windows-desktop|out/artifacts/Holder-windows-staged" -Quiet) {
            throw "Manifest contains a staging path"
          }

          Push-Location $stageDir
          & ".\bin\holderd.exe" --help
          & ".\bin\holderd.exe" --version
          & ".\bin\holderctl.exe" --help
          Pop-Location

      - name: Upload staged package
        uses: actions/upload-artifact@v4
        with:
          name: Holder-windows-staged
          path: out/artifacts/Holder-windows-staged/**
          if-no-files-found: error
          retention-days: 7
